# Firebase App Hosting build/run config.
# The rest of these are public Firebase Web SDK config values (safe to
# commit — access control lives in firestore.rules / storage.rules, not
# here). The API key is pulled from Secret Manager instead purely to keep
# GitHub's secret scanner quiet — it isn't actually sensitive.
# See: https://firebase.google.com/docs/app-hosting/configure

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: beerjourney-25dac.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: beerjourney-25dac
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: beerjourney-25dac.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "533689731702"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:533689731702:web:6ae87f2b91d18199506d57"
    availability:
      - BUILD
      - RUNTIME
